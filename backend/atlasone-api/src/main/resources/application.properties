spring.application.name=atlasone-api

# Conexao PostgreSQL - Supabase
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Monitoramento
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Flyway - Controle de versoes do banco
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT Authentication
atlasone.security.jwt.secret=${JWT_SECRET}
atlasone.security.jwt.access-token-expiration=900000

# Cadastro inicial da organizacao e administrador
atlasone.bootstrap.enabled=${ATLASONE_BOOTSTRAP_ENABLED:false}
atlasone.bootstrap.organization-name=${ATLASONE_BOOTSTRAP_ORGANIZATION_NAME:}
atlasone.bootstrap.organization-slug=${ATLASONE_BOOTSTRAP_ORGANIZATION_SLUG:}
atlasone.bootstrap.admin-name=${ATLASONE_BOOTSTRAP_ADMIN_NAME:}
atlasone.bootstrap.admin-email=${ATLASONE_BOOTSTRAP_ADMIN_EMAIL:}
atlasone.bootstrap.admin-password=${ATLASONE_BOOTSTRAP_ADMIN_PASSWORD:}